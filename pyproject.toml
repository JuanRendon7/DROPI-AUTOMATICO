[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dropi-sales-machine"
version = "0.1.0"
description = "Máquina autónoma de ventas dropshipping con Dropi — sistema multi-agente"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "anthropic>=0.28",
    "httpx>=0.27",
    "jinja2>=3.1",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
agents = [
    "playwright>=1.44",
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.1",
    "langchain-anthropic>=0.1",
    "pytrends-modern>=0.2",
    "TikTokApi>=7.3",
    "google-ads>=24.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "agents"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "alembic/*"]
